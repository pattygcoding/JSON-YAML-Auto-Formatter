[package]
name = "formatter"
version = "1.0.0"
edition = "2021"
description = "JSON and YAML formatter compiled to WebAssembly with Rust"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generate-stress"
path = "src/bin/generate_stress.rs"

[dependencies]
saphyr = { version = "0.2.1", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
